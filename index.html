<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="QuickNotes API client and system design project">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>QuickNotes</h1>
      <p>A browser client practicing the JSONPlaceholder posts API.</p>
    </header>

    <p id="status" role="status" aria-live="polite"></p>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading">Create a note</h2>
      <form id="note-form">
        <label for="title-input">Title (required; 100 characters maximum)</label>
        <input
          id="title-input"
          name="title"
          type="text"
          maxlength="100"
          required
        >

        <label for="body-input">Body (optional)</label>
        <textarea id="body-input" name="body" rows="4"></textarea>

        <button id="submit-btn" type="submit">Create note</button>
      </form>
    </section>

    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Notes</h2>
      <button id="load-btn" type="button">Load notes</button>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
